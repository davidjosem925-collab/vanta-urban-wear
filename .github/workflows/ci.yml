name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:admin-email
      - run: npm run test:e2e:orders
  images-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      # Must pass BEFORE preparation, straight from a clean checkout.
      - run: npm run images:check
      - run: npx vitest run supabase/tests/generated-image-file.test.ts
      - run: npm run images:prepare
      - run: npm run images:check
      - name: Preparation must leave tracked files untouched
        run: git diff --exit-code
  tests-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Unit tests must not depend on a developer's deployed feature flags.
      VITE_SUPABASE_URL: https://vanta-cart-fixture.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_unit_fixture_only
      VITE_DEMO_ORDERS_ENABLED: "true"
      VITE_TURNSTILE_SITE_KEY: test-public-sitekey
      VITE_ADMIN_EMAIL_ACCESS_ENABLED: "true"
    steps:
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run demo:check
      - run: npm run demo:prepare
      - run: git diff --exit-code

  orders-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-test-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run test:orders:postgres
        env:
          VANTA_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
      - run: npm run test:payments:postgres
        env:
          VANTA_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}

  admin-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:admin:auth
      - run: npm run test:admin:email
      - run: npx playwright install --with-deps chromium
      - run: npm run test:admin:passkeys
