project_id = "vanta-urban-wear"

# Public guest endpoint; authentication is challenge + capability + server limits,
# not a user session. All privileged RPCs remain service-only.
[functions.demo-orders]
verify_jwt = false

# Phase 2: no deployment/activation by this file. Each handler verifies its own authority.
# Checkout: existing order capability + rate limit. Webhook: official HMAC + API lookup.
# Worker: private bearer secret. Never accepts a browser session as worker authority.
[functions.mp-checkout]
verify_jwt = false
[functions.mp-webhook]
verify_jwt = false
[functions.mp-reconcile]
verify_jwt = false
